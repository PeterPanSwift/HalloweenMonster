name: Record demo & store screenshots

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - lib/**
      - assets/**
      - integration_test/**
      - tool/**
      - pubspec.yaml
      - ios/**
      - android/**
      - .github/workflows/record.yml

concurrency:
  group: record-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ios:
    name: iPhone 18 Pro Max
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version && flutter pub get

      - name: Boot simulator
        run: tool/ci/ios_boot.sh

      - name: Record
        run: |
          tool/ci/record.sh ios "$SIM_ID" out/ios
          cp device.txt out/ios/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: out/ios
          retention-days: 7

  android:
    name: Pixel 10
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version && flutter pub get

      - name: Warm up Gradle build
        run: flutter build apk --debug

      - name: Boot emulator
        run: tool/ci/android_boot.sh

      - name: Record
        run: |
          tool/ci/record.sh android emulator-5554 out/android
          cp device.txt out/android/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: out/android
          retention-days: 7

  publish:
    name: Trim, compress & publish
    needs: [ios, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: media-in

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow
          curl -sSfL -o NotoSansTC.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf"

      - name: Process media
        run: python3 tool/ci/process_media.py media-in media NotoSansTC.ttf

      - name: Push to the media branch
        run: |
          cp -r media /tmp/media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan media
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/media/. .
          git add -A
          git commit -qm "Demo videos and store screenshots (${GITHUB_SHA::7})"
          git push -f origin media
