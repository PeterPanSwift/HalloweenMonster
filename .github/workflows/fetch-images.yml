name: Fetch monster images

on:
  workflow_dispatch:
  push:
    paths:
      - tool/fetch_images.py
      - .github/workflows/fetch-images.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tool/fetch_images.py candidates
      - name: Push candidates to the image-candidates branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan image-candidates
          git rm -rq --cached .
          git add candidates
          git commit -qm "Image candidates from Wikimedia Commons"
          git push -f origin image-candidates
