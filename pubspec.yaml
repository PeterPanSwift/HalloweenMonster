name: halloween_monster
description: "萬聖節妖怪圖鑑 — 認識萬聖夜出沒的傳說生物。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/monsters/
  fonts:
    - family: Creepster
      fonts:
        - asset: assets/fonts/Creepster-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1A0B33"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
